<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong Game</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, #020817 60%);
      color: #e2e8f0;
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-shell {
      width: min(92vw, 860px);
      padding: 20px 18px 18px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title {
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #f8fafc;
    }

    .scoreboard {
      font-size: 1.4rem;
      font-weight: 700;
      color: #7dd3fc;
      min-width: 110px;
      text-align: right;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, #0f172a, #111827);
      border: 2px solid rgba(148, 163, 184, 0.28);
      border-radius: 12px;
      box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.12);
      cursor: crosshair;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: rgba(30, 41, 59, 0.9);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <div class="title">PONG</div>
      <div id="scoreboard" class="scoreboard">0 : 0</div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreboard');

    const paddleWidth = 14;
    const paddleHeight = 100;
    const paddleSpeed = 7;
    const wallPadding = 14;

    const leftPaddle = {
      x: wallPadding,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      color: '#34d399'
    };

    const rightPaddle = {
      x: canvas.width - wallPadding - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      color: '#60a5fa'
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 8,
      vx: 5,
      vy: 4,
      speed: 5,
      color: '#f8fafc'
    };

    const state = {
      playerScore: 0,
      computerScore: 0,
      running: false,
      lastTime: 0,
      isGameOver: false
    };

    let mouseY = canvas.height / 2;
    let upPressed = false;
    let downPressed = false;

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 5;
      const angle = (Math.random() * 1.2 - 0.6);
      ball.vx = direction * (5 + Math.random() * 1.5) * Math.cos(angle);
      ball.vy = (4 + Math.random() * 2) * Math.sin(angle);
    }

    function updateScoreboard() {
      scoreEl.textContent = `${state.playerScore} : ${state.computerScore}`;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function moveLeftPaddle() {
      if (mouseY !== null) {
        leftPaddle.y = mouseY - leftPaddle.height / 2;
      }

      if (upPressed) leftPaddle.y -= paddleSpeed;
      if (downPressed) leftPaddle.y += paddleSpeed;

      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);
    }

    function moveComputerPaddle() {
      const targetY = ball.y - rightPaddle.height / 2;
      const diff = targetY - rightPaddle.y;
      const step = Math.abs(diff) < 2 ? 0 : diff * 0.12;
      rightPaddle.y += step;
      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);
    }

    function handleWallCollision() {
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      }

      if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }
    }

    function handlePaddleCollision(paddle) {
      const hitsPaddle =
        ball.x - ball.radius <= paddle.x + paddle.width &&
        ball.x + ball.radius >= paddle.x &&
        ball.y >= paddle.y &&
        ball.y <= paddle.y + paddle.height;

      if (!hitsPaddle) return false;

      const relativeIntersect = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
      const bounceAngle = relativeIntersect * (Math.PI / 3);
      const direction = paddle === leftPaddle ? 1 : -1;
      const speedBoost = Math.min(1.08, ball.speed / 6 + 0.07);

      ball.speed *= speedBoost;
      ball.vx = direction * (Math.abs(ball.vx) + 0.8) * Math.cos(bounceAngle);
      ball.vy = Math.sin(bounceAngle) * ball.speed;

      if (paddle === leftPaddle) {
        ball.x = paddle.x + paddle.width + ball.radius;
      } else {
        ball.x = paddle.x - ball.radius;
      }

      return true;
    }

    function updateGame() {
      moveLeftPaddle();
      moveComputerPaddle();

      ball.x += ball.vx;
      ball.y += ball.vy;

      handleWallCollision();

      if (handlePaddleCollision(leftPaddle)) {
        return;
      }

      if (handlePaddleCollision(rightPaddle)) {
        return;
      }

      if (ball.x - ball.radius < 0) {
        state.computerScore += 1;
        updateScoreboard();
        resetBall(1);
      } else if (ball.x + ball.radius > canvas.width) {
        state.playerScore += 1;
        updateScoreboard();
        resetBall(-1);
      }
    }

    function drawNet() {
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
      ctx.lineWidth = 4;
      ctx.setLineDash([16, 14]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(paddle) {
      ctx.fillStyle = paddle.color;
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.fillStyle = ball.color;
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawNet();
      drawPaddle(leftPaddle);
      drawPaddle(rightPaddle);
      drawBall();
    }

    function gameLoop(timestamp) {
      if (!state.running) {
        requestAnimationFrame(gameLoop);
        return;
      }

      const delta = timestamp - state.lastTime || 16;
      state.lastTime = timestamp;

      updateGame();
      draw();

      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      if (!state.running) {
        state.running = true;
        state.lastTime = performance.now();
        requestAnimationFrame(gameLoop);
      }
    }

    function pauseGame() {
      state.running = false;
    }

    function resetGame() {
      state.playerScore = 0;
      state.computerScore = 0;
      updateScoreboard();
      resetBall(Math.random() < 0.5 ? -1 : 1);
      draw();
    }

    canvas.addEventListener('mousemove', (event) => {
      const rect = canvas.getBoundingClientRect();
      mouseY = event.clientY - rect.top;
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowUp') upPressed = true;
      if (event.key === 'ArrowDown') downPressed = true;
    });

    window.addEventListener('keyup', (event) => {
      if (event.key === 'ArrowUp') upPressed = false;
      if (event.key === 'ArrowDown') downPressed = false;
    });

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('pauseBtn').addEventListener('click', pauseGame);
    document.getElementById('resetBtn').addEventListener('click', () => {
      pauseGame();
      resetGame();
    });

    updateScoreboard();
    resetBall(Math.random() < 0.5 ? -1 : 1);
    draw();
    startGame();
  </script>
</body>
</html>
